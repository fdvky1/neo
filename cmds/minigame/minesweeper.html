<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Minesweeper</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    overflow: hidden;
    background: #111;
    color: #fff;
    font-family: 'Segoe UI', Arial, sans-serif;
    touch-action: manipulation;
  }
  .game-wrapper {
    width: 100%;
    max-width: 400px;
    margin: auto;
    padding: 15px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 15px;
  }
  .header h1 {
    margin: 0;
    font-size: 28px;
    color: #fff;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-bottom: 15px;
  }
  .mines-counter {
    background: #222;
    padding: 8px 15px;
    border-radius: 5px;
    color: #f44336;
    font-weight: bold;
    font-size: 20px;
    text-align: center;
    border: 1px solid #333;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-reset {
    background: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    padding: 8px 15px;
    font-weight: bold;
    cursor: pointer;
    font-size: 16px;
  }
  #mode-btn {
    background: #4caf50;
    color: white;
    border: none;
    border-radius: 5px;
    padding: 10px 20px;
    font-weight: bold;
    cursor: pointer;
    font-size: 18px;
    width: 100%;
    margin-top: 20px;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    gap: 2px;
    background: #444;
    padding: 4px;
    border-radius: 5px;
    width: 100%;
    aspect-ratio: 1;
    box-sizing: border-box;
  }
  .cell {
    background: #777;
    border-radius: 3px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: bold;
    font-size: 20px;
    user-select: none;
    cursor: pointer;
    box-shadow: inset 2px 2px 0px rgba(255,255,255,0.2), inset -2px -2px 0px rgba(0,0,0,0.2);
    overflow: hidden;
  }
  .cell:active {
    background: #666;
  }
  .cell.revealed {
    background: #333;
    box-shadow: none;
  }
  .cell.mine {
    background: #e63946 !important;
    box-shadow: none !important;
  }
  .cell-1 { color: #4285f4; }
  .cell-2 { color: #34a853; }
  .cell-3 { color: #ea4335; }
  .cell-4 { color: #fbbc05; }
  .cell-5 { color: #ff6d00; }
  .cell-6 { color: #00acc1; }
  .cell-7 { color: #d81b60; }
  .cell-8 { color: #8e24aa; }
  
  #game-over {
    display: none;
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.8);
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  #game-over h2 { color: #fff; font-size: 30px; margin-bottom: 20px; text-align: center; }
  #game-over button { padding: 10px 20px; background: #4caf50; color: #fff; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <h1>Minesweeper</h1>
    <button class="btn-reset" onclick="confirmReset()">Reset</button>
  </div>
  
  <div class="status-bar">
    <div class="mines-counter">
      <span>🚩</span>
      <span id="mines-left">10</span>
    </div>
  </div>
  
  <div style="position: relative; width: 100%;">
    <div id="grid"></div>
    <div id="game-over">
      <h2 id="game-over-text">Game Over!</h2>
      <button onclick="init()">Play Again</button>
    </div>
  </div>
  
  <button id="mode-btn" onclick="toggleMode()">Mode: ⛏️ Dig</button>
</div>

<script>
let board = [];
const rows = 9;
const cols = 9;
const numMines = 10;
let minesLeft = numMines;
let mode = 'dig'; // 'dig' or 'flag'
let gameOver = false;
let firstClick = true;

function init() {
    board = [];
    firstClick = true;
    gameOver = false;
    minesLeft = numMines;
    document.getElementById('game-over').style.display = 'none';
    updateUI();
    
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for(let r=0; r<rows; r++) {
        board[r] = [];
        for(let c=0; c<cols; c++) {
            board[r][c] = {
                r, c,
                isMine: false,
                isRevealed: false,
                isFlagged: false,
                neighborMines: 0,
                el: null
            };
            const cell = document.createElement('div');
            cell.className = 'cell';
            // Use pointer events for fast mobile tap
            cell.onpointerup = (e) => {
                e.preventDefault();
                handleCellClick(r, c);
            };
            grid.appendChild(cell);
            board[r][c].el = cell;
        }
    }
}

function placeMines(firstR, firstC) {
    let minesPlaced = 0;
    while(minesPlaced < numMines) {
        let r = Math.floor(Math.random() * rows);
        let c = Math.floor(Math.random() * cols);
        // Ensure first click and its immediate neighbors are safe
        let isSafeZone = Math.abs(r - firstR) <= 1 && Math.abs(c - firstC) <= 1;
        
        if(!board[r][c].isMine && !isSafeZone) {
            board[r][c].isMine = true;
            minesPlaced++;
        }
    }
    
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            if(!board[r][c].isMine) {
                let count = 0;
                for(let dr=-1; dr<=1; dr++) {
                    for(let dc=-1; dc<=1; dc++) {
                        if(r+dr>=0 && r+dr<rows && c+dc>=0 && c+dc<cols) {
                            if(board[r+dr][c+dc].isMine) count++;
                        }
                    }
                }
                board[r][c].neighborMines = count;
            }
        }
    }
}

function handleCellClick(r, c) {
    if(gameOver) return;
    let cell = board[r][c];
    
    // Chording Feature
    if(cell.isRevealed) {
        if(cell.neighborMines > 0) {
            let flagCount = 0;
            let neighborsToReveal = [];
            for(let dr=-1; dr<=1; dr++) {
                for(let dc=-1; dc<=1; dc++) {
                    if(r+dr>=0 && r+dr<rows && c+dc>=0 && c+dc<cols) {
                        let n = board[r+dr][c+dc];
                        if(n.isFlagged) flagCount++;
                        else if(!n.isRevealed) neighborsToReveal.push(n);
                    }
                }
            }
            // If flags match the number, reveal all surrounding unflagged cells
            if(flagCount === cell.neighborMines) {
                let oldMode = mode;
                mode = 'dig';
                neighborsToReveal.forEach(n => {
                    if(!gameOver) handleCellClick(n.r, n.c);
                });
                mode = oldMode;
            }
        }
        return;
    }
    
    if(mode === 'flag') {
        cell.isFlagged = !cell.isFlagged;
        minesLeft += cell.isFlagged ? -1 : 1;
        cell.el.innerText = cell.isFlagged ? '🚩' : '';
        // Add subtle animation for flagging
        cell.el.style.transform = cell.isFlagged ? 'scale(1.1)' : 'scale(1)';
        setTimeout(() => cell.el.style.transform = '', 150);
        updateUI();
        checkWin();
        return;
    }
    
    if(cell.isFlagged) return; // Prevent digging flagged cell
    
    if(firstClick) {
        placeMines(r, c);
        firstClick = false;
    }
    
    if(cell.isMine) {
        cell.el.classList.add('mine');
        cell.el.innerText = '💥';
        revealAllMines();
        endGame('Game Over! 💣');
    } else {
        reveal(r, c);
        checkWin();
    }
}

function reveal(r, c) {
    let cell = board[r][c];
    if(cell.isRevealed || cell.isFlagged) return;
    
    cell.isRevealed = true;
    cell.el.classList.add('revealed');
    
    if(cell.neighborMines > 0) {
        cell.el.innerText = cell.neighborMines;
        cell.el.classList.add('cell-' + cell.neighborMines);
    } else {
        // Flood fill empty neighbors
        for(let dr=-1; dr<=1; dr++) {
            for(let dc=-1; dc<=1; dc++) {
                if(r+dr>=0 && r+dr<rows && c+dc>=0 && c+dc<cols) {
                    reveal(r+dr, c+dc);
                }
            }
        }
    }
}

function revealAllMines() {
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let cell = board[r][c];
            if(cell.isMine && !cell.isFlagged) {
                if (!cell.isRevealed) {
                    cell.el.innerText = '💣';
                    cell.el.classList.add('revealed');
                }
            } else if(!cell.isMine && cell.isFlagged) {
                cell.el.innerText = '❌';
                cell.el.classList.add('revealed');
            }
        }
    }
}

function checkWin() {
    let hiddenSafe = 0;
    for(let r=0; r<rows; r++) {
        for(let c=0; c<cols; c++) {
            let cell = board[r][c];
            if(!cell.isMine && !cell.isRevealed) hiddenSafe++;
        }
    }
    if(hiddenSafe === 0) {
        revealAllMines(); // Turn remaining unflagged mines to bombs
        endGame('You Win! 🎉');
    }
}

function endGame(msg) {
    gameOver = true;
    setTimeout(() => {
        document.getElementById('game-over-text').innerText = msg;
        document.getElementById('game-over').style.display = 'flex';
    }, 500);
}

function toggleMode() {
    mode = mode === 'dig' ? 'flag' : 'dig';
    updateUI();
}

function confirmReset() {
    if(confirm('Reset current game?')) {
        init();
    }
}

function updateUI() {
    document.getElementById('mines-left').innerText = minesLeft;
    const modeBtn = document.getElementById('mode-btn');
    if(mode === 'dig') {
        modeBtn.innerText = 'Mode: ⛏️ Dig';
        modeBtn.style.background = '#00acc1';
    } else {
        modeBtn.innerText = 'Mode: 🚩 Flag';
        modeBtn.style.background = '#f44336';
    }
}

init();
</script>
</body>
</html>
